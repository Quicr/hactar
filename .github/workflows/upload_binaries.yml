name: Upload Binaries
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Firmware CI]
    branches: [main]
    types:
      - completed

permissions:
  contents: write

jobs:
  on-success:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Download hactar binaries
        shell: bash
        run: |
          mkdir -p build/main/mgmt
          mkdir -p build/main/net
          mkdir -p build/main/ui
          gh release download nightly -p 'mgmt.bin' -D build/main/mgmt --clobber
          gh release download nightly -p 'net.bin' -D build/main/net --clobber
          gh release download nightly -p 'bootloader.bin' -D build/main/net --clobber
          gh release download nightly -p 'partition-table.bin' -D build/main/net --clobber
          gh release download nightly -p 'ui.bin' -D build/main/ui --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push binaries
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build/main
          git commit -m "Update binaries from Nightly build" || echo "No changes to commit"
          git push origin gh-pages
