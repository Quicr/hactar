name: Build Firmware CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag to build (blank uses selected workflow ref; refs/tags/NAME selects a tag explicitly)"
        type: string
        required: false
      publish:
        description: "Publish binaries to gh-pages"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      link: ${{ github.event_name == 'workflow_dispatch' || steps.source.outputs.publish == 'true' || steps.filter.outputs.link == 'true' }}
      net: ${{ github.event_name == 'workflow_dispatch' || steps.source.outputs.publish == 'true' || steps.filter.outputs.net == 'true' }}
      ui: ${{ github.event_name == 'workflow_dispatch' || steps.source.outputs.publish == 'true' || steps.filter.outputs.ui == 'true' }}
      sha: ${{ steps.source.outputs.sha }}
      ref: ${{ steps.source.outputs.ref }}
    steps:
    - name: Resolve source branch or tag
      id: source
      uses: actions/github-script@v7
      env:
        SOURCE_REF: ${{ inputs.source_ref }}
        PUBLISH: ${{ inputs.publish }}
      with:
        script: |
          const fs = require('fs');
          let ref = context.ref;
          let sha = context.sha;
          if (context.eventName === 'workflow_dispatch') {
            const requested = process.env.SOURCE_REF.trim();
            if (requested) {
              const candidates = requested.startsWith('refs/')
                ? [requested]
                : [`refs/heads/${requested}`, `refs/tags/${requested}`];
              ref = null;
              for (const candidate of candidates) {
                if (!/^refs\/(heads|tags)\//.test(candidate)) {
                  throw new Error('Choose a branch or tag, not another type of Git ref');
                }
                try {
                  await github.rest.git.getRef({
                    ...context.repo, ref: candidate.slice('refs/'.length)
                  });
                  ref = candidate;
                  break;
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              if (!ref) throw new Error(`Branch or tag not found: ${requested}`);
            }
            const commit = await github.rest.repos.getCommit({...context.repo, ref});
            sha = commit.data.sha;
          }
          const publish = (context.eventName === 'push' && ref === 'refs/heads/main') ||
            (context.eventName === 'workflow_dispatch' && process.env.PUBLISH === 'true');
          core.setOutput('sha', sha);
          core.setOutput('ref', ref);
          core.setOutput('publish', String(publish));
          fs.writeFileSync('publication.json', JSON.stringify({
            ref, sha, publish, run_id: context.runId
          }, null, 2) + '\n');

    - name: Upload publication metadata
      uses: actions/upload-artifact@v4
      with:
        name: publication
        path: publication.json
        if-no-files-found: error

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.source.outputs.sha }}
    - uses: dorny/paths-filter@v3
      if: github.event_name != 'workflow_dispatch'
      id: filter
      with:
        filters: |
          link:
            - 'link'
            - 'link/**'
          net:
            - 'firmware/net/**'
          ui:
            - 'firmware/ui/**'
            - 'firmware/shared/**'
            - 'firmware/shared_inc/**'

  test-link:
    needs: changes
    if: ${{ needs.changes.outputs.link == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.sha }}
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev

    - name: Run link tests
      working-directory: ./link/link
      run: cargo test --features std

  build-ctl:
    needs: changes
    if: ${{ needs.changes.outputs.link == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.sha }}
        submodules: recursive

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libudev-dev libasound2-dev

    - name: Build CTL
      working-directory: ./link/ctl
      run: cargo build --release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ctl
        path: link/ctl/target/release/ctl

  build-mgmt:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.sha }}

    - name: Initialize Link submodule
      run: git submodule update --init link

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv6m-none-eabi
        components: llvm-tools-preview

    - name: Install binary export tools
      run: cargo install cargo-binutils --locked

    - name: Build MGMT binary
      working-directory: ./link/mgmt
      run: cargo objcopy --release -- -O binary mgmt.bin

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mgmt
        path: link/mgmt/mgmt.bin
        if-no-files-found: error

    - name: Upload mgmt binary
      if: github.event_name == 'push' && needs.changes.outputs.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: nightly
        name: "Nightly Build"
        allowUpdates: true
        replacesArtifacts: true
        artifacts: link/mgmt/mgmt.bin
        artifactErrorsFailBuild: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-net:
    needs: changes
    if: ${{ needs.changes.outputs.net == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: espressif/idf:v5.5.3
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.sha }}
        submodules: recursive

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y make git curl unzip cmake bash pkg-config

    - name: Build
      working-directory: ./firmware/net
      shell: bash
      run: |
        . $IDF_PATH/export.sh
        make -j compile

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: net
        if-no-files-found: error
        path: |
          firmware/net/build/bootloader/bootloader.bin
          firmware/net/build/partition_table/partition-table.bin
          firmware/net/build/net.bin
          firmware/net/build/net.elf

    - name: Upload net binary
      if: github.event_name == 'push' && needs.changes.outputs.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: nightly
        name: "Nightly Build"
        allowUpdates: true
        replacesArtifacts: true
        artifacts: |
          firmware/net/build/bootloader/bootloader.bin
          firmware/net/build/partition_table/partition-table.bin
          firmware/net/build/net.bin
          firmware/net/build/net.elf
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ui:
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.changes.outputs.sha }}
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib stlink-tools python3 pip
        pip install pyserial

    - name: Build
      working-directory: ./firmware/ui
      shell: bash
      run: make -j compile

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ui
        if-no-files-found: error
        path: |
          firmware/ui/build/ui.bin
          firmware/ui/build/ui.elf
          firmware/ui/build/ui.hex

    - name: Upload ui binary
      if: github.event_name == 'push' && needs.changes.outputs.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        tag: nightly
        name: "Nightly Build"
        allowUpdates: true
        replacesArtifacts: true
        artifacts: firmware/ui/build/ui.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
